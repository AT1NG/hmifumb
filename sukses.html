<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

<body class="bg-paper">
  <main class="wrap flex min-h-screen flex-col justify-center py-16">

    <div class="mt-10 flex flex-col items-start gap-5 sm:flex-row sm:items-center">
      <a href="https://wa.me/6281234567890" target="_blank" rel="noopener" class="btn-primary" data-cta="sukses-wa">Ikuti WhatsApp HMIF</a>
      <a href="./" class="font-semibold underline decoration-2 underline-offset-[6px]">Kembali ke jadwal</a>

  <script>
    const e = new URLSearchParams(location.search).get('event');
    if (e) document.getElementById('ev').textContent = e;
